  <text x="30" y="100" clip-path="url(#c1)"><tspan class="g">❯</tspan> <tspan class="b">whoami</tspan></text>
  <text x="30" y="126" clip-path="url(#c2)" class="y">Jensi Gajera — Developer</text>

  <text x="30" y="162" clip-path="url(#c3)"><tspan class="g">❯</tspan> <tspan class="b">cat</tspan> about.txt</text>
  <text x="30" y="188" clip-path="url(#c4)">I'm a passionate developer who enjoys turning ideas into</text>
  <text x="30" y="214" clip-path="url(#c5)">clean, efficient and user-friendly applications. I love solving</text>
