  <text x="30" y="276" clip-path="url(#c7)"><tspan class="g">❯</tspan> <tspan class="b">cat</tspan> now.txt</text>
  <text x="30" y="302" clip-path="url(#c8)" xml:space="preserve"><tspan class="d">▸</tspan> Working on  : <tspan class="y">exciting projects</tspan></text>
  <text x="30" y="328" clip-path="url(#c9)" xml:space="preserve"><tspan class="d">▸</tspan> Learning    : <tspan class="y">modern web tech &amp; best practices</tspan></text>
  <text x="30" y="354" clip-path="url(#c10)" xml:space="preserve"><tspan class="d">▸</tspan> Open to     : <tspan class="y">open-source collaboration</tspan></text>
  <text x="30" y="380" clip-path="url(#c11)" xml:space="preserve"><tspan class="d">▸</tspan> Ask me      : <tspan class="y">programming, web dev, problem solving</tspan></text>
  <text x="30" y="406" clip-path="url(#c12)" xml:space="preserve"><tspan class="d">▸</tspan> Fun fact    : <tspan class="y">every bug is a lesson in disguise</tspan></text>

